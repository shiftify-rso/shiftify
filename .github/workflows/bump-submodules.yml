name: bump submodules

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-submodules

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: update submodules to latest main
        run: git submodule update --remote

      - name: open and merge pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only | xargs -rn1 basename | paste -sd, - | sed 's/,/, /g')
          if [ -z "$changed" ]; then echo "all submodules up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bump/submodules-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -am "bump $changed"
          git push origin "$branch"
          gh pr create --title "bump $changed" --body "" --head "$branch"
          gh pr merge "$branch" --squash --delete-branch
